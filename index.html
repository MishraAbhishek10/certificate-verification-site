<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243a">
  <title>Certificate Verification</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f6fa; color: #182536;
           font-family: Arial, Helvetica, sans-serif; }
    header { background: #10243a; color: white; padding: 22px 18px; }
    .header-inner, main { width: min(980px, calc(100% - 32px)); margin: auto; }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
    .sub { color: #c8d5e3; font-size: 13px; margin-top: 5px; }
    main { padding: 34px 0; }
    .panel { background: white; border: 1px solid #e1e7ef; border-radius: 14px;
             box-shadow: 0 8px 28px rgba(20,40,65,.07); overflow: hidden; }
    .status { padding: 22px 24px; border-bottom: 1px solid #e8edf3; }
    .status h1 { font-size: 22px; margin: 0 0 8px; }
    .status p { margin: 0; color: #607086; font-size: 14px; line-height: 1.5; }
    .pill { display: inline-block; margin-top: 14px; padding: 7px 11px;
            border-radius: 99px; background: #e8f7ee; color: #176b39;
            font-size: 12px; font-weight: 700; }
    .details { padding: 20px 24px; display: grid;
               grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
    .label { color: #718096; font-size: 11px; text-transform: uppercase;
             letter-spacing: .7px; margin-bottom: 6px; }
    .value { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    .viewer { border-top: 1px solid #e8edf3; background: #f8fafc; padding: 16px; }
    .viewer iframe { display: block; width: 100%; height: 78vh; min-height: 520px;
                     border: 1px solid #dbe3ec; border-radius: 8px; background: white; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 24px 22px; }
    a.button { display: inline-block; padding: 11px 15px; border-radius: 8px;
               background: #155eef; color: white; text-decoration: none;
               font-size: 14px; font-weight: 700; }
    a.secondary { background: #eaf0f7; color: #23364d; }
    .error { padding: 30px 24px; }
    .error h1 { margin-top: 0; }
    .muted { color: #66758a; line-height: 1.55; }
    footer { text-align: center; color: #7a8798; font-size: 12px; padding: 20px; }
    @media (max-width: 600px) {
      .details { grid-template-columns: 1fr; }
      .status, .details { padding-left: 18px; padding-right: 18px; }
      .actions { padding-left: 18px; padding-right: 18px; }
      .viewer { padding: 8px; }
      .viewer iframe { height: 72vh; min-height: 440px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">Certificate Verification</div>
      <div class="sub">Certificate document portal</div>
    </div>
  </header>
  <main id="app">
    <section class="panel">
      <div class="status">
        <h1>Opening certificate…</h1>
        <p>Please wait while we load the certificate document.</p>
      </div>
    </section>
  </main>
  <footer>This is an independent certificate-hosting page and is not affiliated with NPTEL.</footer>
  <script>
    // Certificate IDs are URL-safe and map to PDFs stored in /public/certificates.
    const certificates = {
      "NPTEL26GE82S953800010": {
        name: "Roshan Raj",
        course: "Conservation Geography",
        session: "JUL-OCT 2026",
        roll: "NPTEL26GE82S953800010",
        file: "/certificates/roshan-raj-conservation-geography.pdf"
      }
    };

    const parts = window.location.pathname.split("/").filter(Boolean);
    const id = parts[0] === "verify" ? decodeURIComponent(parts[1] || "") : "";
    const cert = certificates[id];
    const app = document.getElementById("app");

    if (!cert) {
      app.innerHTML = `
        <section class="panel error">
          <h1>Certificate link not found</h1>
          <p class="muted">The certificate ID in this URL is not registered on this site. Please check the QR code or link.</p>
        </section>`;
    } else {
      app.innerHTML = `
        <section class="panel">
          <div class="status">
            <h1>Certificate document</h1>
            <p>The requested certificate is being displayed below.</p>
            <span class="pill">DOCUMENT AVAILABLE</span>
          </div>
          <div class="details">
            <div><div class="label">Certificate holder</div><div class="value">${cert.name}</div></div>
            <div><div class="label">Course</div><div class="value">${cert.course}</div></div>
            <div><div class="label">Course session</div><div class="value">${cert.session}</div></div>
            <div><div class="label">Certificate / roll ID</div><div class="value">${cert.roll}</div></div>
          </div>
          <div class="actions">
            <a class="button" href="${cert.file}" target="_blank" rel="noopener">Open PDF</a>
            <a class="button secondary" href="${cert.file}" download>Download PDF</a>
          </div>
          <div class="viewer">
            <iframe title="Certificate PDF" src="${cert.file}#toolbar=1&navpanes=0"></iframe>
          </div>
        </section>`;
    }
  </script>
</body>
</html>
